<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Par-alarm</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0c;
      --panel: #12161a;
      --text: #f4f7ee;
      --muted: #aeb7aa;
      --lime: #d7ff21;
      --line: #3a4438;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(215, 255, 33, .16), transparent 30%), var(--bg);
      color: var(--text);
    }
    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      background: rgba(18, 22, 26, .92);
      box-shadow: 0 0 34px rgba(215, 255, 33, .12);
    }
    h1 {
      margin: 0 0 10px;
      color: var(--lime);
      font-size: clamp(32px, 6vw, 54px);
      letter-spacing: 0;
    }
    p { color: var(--muted); line-height: 1.8; }
    a {
      color: var(--lime);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Par-alarm</h1>
      <p>音量または振動を監視して、設定した条件で通知するアプリです。</p>
      <p><a href="./privacy_policy.html">プライバシーポリシー</a></p>
      <p><a href="./disclaimer.html">免責事項</a></p>
    </section>
  </main>
</body>
</html>
